# Mosquitto Configuration for Smart IoT Park Platform

# Standard MQTT Listener
listener 1883 0.0.0.0
protocol mqtt

# WebSocket Listener for Browser MQTT clients
listener 9001 0.0.0.0
protocol websockets

# Security & Access
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
