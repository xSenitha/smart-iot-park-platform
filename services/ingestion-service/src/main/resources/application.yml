server:
  port: ${INGESTION_SERVICE_PORT:8082}

spring:
  application:
    name: ingestion-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smartpark_telemetry}

# MQTT Subscriber Settings
smartpark:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-host: ${MQTT_BROKER_HOST:localhost}
    broker-port: ${MQTT_BROKER_PORT:1883}
    client-id: ${MQTT_CLIENT_ID:smartpark-ingestion-subscriber}
    topic-filter: ${MQTT_TOPIC_FILTER:parks/+/zones/+/devices/+/telemetry}
  core-api:
    url: ${CORE_API_URL:http://localhost:8081}
    sync-heartbeat: ${SYNC_HEARTBEAT:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
