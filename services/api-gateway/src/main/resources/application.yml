server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600
      routes:
        # Route 1: Telemetry Ingestion Service
        - id: telemetry-ingestion-route
          uri: ${INGESTION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/telemetry/**

        # Route 2: AI Predictive Engine (FastAPI)
        - id: ai-engine-predictions-route
          uri: ${AI_ENGINE_URL:http://localhost:8000}
          predicates:
            - Path=/api/v1/predict/**, /api/v1/jobs/**, /api/v1/models/**, /api/v1/predictions/**

        # Route 3: Core API (Auth, Parks, Zones, Devices, Alerts, Maintenance)
        - id: core-api-route
          uri: ${CORE_API_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

smartpark:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.smartpark.gateway: DEBUG
