name: Deployment & Container Build Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build & Verify Production Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: core-api
            context: ./services/core-api
          - service: ingestion-service
            context: ./services/ingestion-service
          - service: api-gateway
            context: ./services/api-gateway
          - service: ai-engine
            context: ./services/ai-engine
          - service: sensor-simulator
            context: ./services/sensor-simulator
          - service: frontend
            context: ./frontend/dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: smartpark/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
