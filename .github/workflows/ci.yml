name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Core API (Java 21 + Spring Boot 3 + MySQL)
  # ============================================================================
  core-api:
    name: Core API (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Core API Unit & Integration Tests
        run: |
          cd services/core-api
          chmod +x mvnw
          ./mvnw clean test

  # ============================================================================
  # 2. Ingestion Service (Java 21 + Spring Boot 3 + MongoDB Reactive)
  # ============================================================================
  ingestion-service:
    name: Ingestion Service (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Ingestion Service Tests
        run: |
          cd services/ingestion-service
          chmod +x mvnw
          ./mvnw clean test

  # ============================================================================
  # 3. API Gateway (Java 21 + Spring Cloud Gateway)
  # ============================================================================
  api-gateway:
    name: API Gateway (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run API Gateway Tests
        run: |
          cd services/api-gateway
          chmod +x mvnw
          ./mvnw clean test

  # ============================================================================
  # 4. AI Engine (Python 3.12 + FastAPI + ML Models)
  # ============================================================================
  ai-engine:
    name: AI Engine (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd services/ai-engine
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Engine Unit Tests
        run: |
          cd services/ai-engine
          python -m unittest discover -s tests -v

  # ============================================================================
  # 5. Sensor Simulator (Python 3.12)
  # ============================================================================
  sensor-simulator:
    name: Sensor Simulator (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Simulator Tests
        run: |
          cd services/sensor-simulator
          python -m unittest discover -s tests -v

  # ============================================================================
  # 6. Frontend Dashboard (React 18 + TypeScript + Vite)
  # ============================================================================
  frontend:
    name: Frontend Dashboard (React TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/dashboard/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend/dashboard
          npm ci

      - name: Run Unit Tests
        run: |
          cd frontend/dashboard
          npm test

      - name: Build Production Bundle
        run: |
          cd frontend/dashboard
          npm run build
